<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Watchly - Leaderboard</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/lucide-static@0.453.0/font/lucide.css">
    <link rel="stylesheet" href="styles.css?v=7">
</head>
<body>
    <!-- Fixed Navigation Bar -->
    <nav class="navbar">
        <div class="nav-brand" style="font-size: 0.75rem;">Watchly</div>
        <button class="hamburger" id="hamburger" aria-label="Menu">
            <span></span><span></span><span></span>
        </button>
        <div class="nav-links" id="navLinks">
            <div class="nav-menu-container">
                <a href="index.html" class="nav-link" style="font-size: 0.7rem;">Home</a>
                <a href="search.html" class="nav-link" style="font-size: 0.7rem;">Browse</a>
                <a href="leaderboard.html" class="nav-link active-nav" style="font-size: 0.7rem;">Leaderboard</a>
                <a href="backup.html" class="nav-link" style="font-size: 0.7rem;">Backup</a>
                <a href="guide.html" class="nav-link" style="font-size: 0.7rem;">Guide</a>
                <a href="history.html" class="nav-link" style="font-size: 0.7rem;">History</a>
                <a href="settings.html" class="nav-link" style="font-size: 0.7rem;">Settings</a>
            </div>
        </div>
    </nav>
    
    <!-- Site blur overlay -->
    <div class="site-blur-overlay" id="siteBlur"></div>
    
    <div class="container">
        <header>
            <h1>Leaderboard</h1>
            <p>Rank your favorite movies and shows</p>
        </header>

        <main>
            <div class="leaderboard-container">
                <div class="add-to-ranking">
                    <button id="addToRankingBtn" class="add-btn">+ Add to Leaderboard</button>
                </div>
                <div class="ranking-list" id="rankingList"></div>
            </div>
        </main>
    </div>

    <!-- Remove Confirmation Modal -->
    <div id="removeModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Remove from Leaderboard</h2>
            <p id="removeMessage"></p>
            <div class="modal-actions">
                <button id="confirmRemove" class="delete-btn">Remove</button>
                <button id="cancelRemove" class="cancel-btn">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Add to Leaderboard Modal -->
    <div id="addToLeaderboardModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Add to Leaderboard</h2>
            <p style="margin-bottom: 20px; color: var(--silver);">Select shows from your watchlist to add to leaderboard</p>
            
            <div class="search-filter">
                <input type="text" id="leaderboardSearchInput" placeholder="Search your watchlist..." style="margin-bottom: 15px; width: 100%; padding: 12px; background: var(--bg); color: var(--light); border: 1px solid var(--muted); border-radius: 8px;">
            </div>
            
            <div class="available-shows-grid" id="availableShowsGrid">
                <!-- Populated by JavaScript -->
            </div>
            
            <div class="no-shows-message" id="noShowsLeaderboard" style="display: none;">
                <p style="text-align: center; color: var(--silver); padding: 40px;">
                    No shows available to add. All shows are already in your leaderboard!
                </p>
            </div>
        </div>
    </div>

    <style>
        .leaderboard-container {
            max-width: 800px;
            margin: 0 auto;
        }

        .ranking-list {
            background: var(--surface);
            border: 1px solid rgba(195,199,206,0.1);
            border-radius: 12px;
            padding: 0 20px;
        }

        .ranking-item {
            padding: 20px 0;
            margin-bottom: 0;
            display: flex;
            align-items: center;
            gap: 20px;
            cursor: default;
            transition: all 0.3s ease;
            position: relative;
            border-bottom: 1px solid rgba(195,199,206,0.15);
        }

        .ranking-item:last-child {
            border-bottom: none;
        }

        .ranking-item:hover {
            background: rgba(195,199,206,0.03);
        }

        .ranking-item.dragging {
            opacity: 0.5;
        }

        .ranking-item.drag-over::before {
            content: '';
            position: absolute;
            top: -8px;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--light);
            box-shadow: 0 0 15px var(--light);
            border-radius: 2px;
        }

        .rank-number {
            font-size: 2rem;
            font-weight: 700;
            color: var(--light);
            min-width: 50px;
            text-align: center;
        }

        .item-info {
            flex: 1;
        }

        .item-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--light);
            margin-bottom: 5px;
        }

        .item-details {
            color: var(--silver);
            font-size: 0.9rem;
        }

        .drag-handle {
            color: var(--muted);
            font-size: 1.5rem;
            cursor: grab;
            display: flex;
            align-items: center;
            transform: translateY(-3px);
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        .drag-handle:active {
            cursor: grabbing;
        }

        .no-items {
            text-align: center;
            padding: 60px 20px;
            color: var(--silver);
            font-size: 1.2rem;
        }

        .add-to-ranking {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            align-items: center;
            justify-content: center;
        }

        .add-to-ranking button {
            padding: 12px 24px;
            background: var(--muted);
            color: var(--light);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
        }

        .available-shows-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
            max-height: 500px;
            overflow-y: auto;
            padding: 10px 0;
        }

        .leaderboard-show-card {
            cursor: pointer;
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            position: relative;
        }

        .leaderboard-show-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }

        .leaderboard-show-card.has-poster {
            aspect-ratio: 2/3;
        }

        .leaderboard-show-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .leaderboard-show-card .item-poster-footer {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.7) 70%, transparent 100%);
            padding: 30px 12px 12px;
        }

        .leaderboard-show-card .item-poster-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--light);
            margin-bottom: 4px;
            line-height: 1.2;
        }

        .leaderboard-show-card .item-poster-meta {
            font-size: 0.7rem;
            color: var(--silver);
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .leaderboard-show-card.no-poster {
            aspect-ratio: 2/3;
            background: var(--surface);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
            text-align: center;
        }

        .leaderboard-show-card .item-poster-placeholder-letter {
            font-size: 3rem;
            font-weight: 700;
            color: var(--light);
            margin-bottom: 10px;
        }

        .leaderboard-show-card.no-poster .item-poster-title {
            font-size: 0.9rem;
            color: var(--light);
            font-weight: 600;
        }

        .delete-from-ranking {
            background: none;
            color: var(--muted);
            border: none;
            cursor: pointer;
            font-size: 1.5rem;
            padding: 5px;
        }

        .delete-from-ranking:hover {
            color: #ff4444;
        }

        @media (max-width: 768px) {
            .leaderboard-container {
                padding: 0 4px;
            }

            .ranking-list {
                padding: 0 12px;
            }

            .leaderboard-item {
                padding: 14px 12px;
                gap: 12px;
            }

            .rank-number {
                font-size: 1.1rem;
                width: 36px;
            }

            .item-content h3 {
                font-size: 0.95rem;
            }

            .item-meta {
                font-size: 0.75rem;
            }

            .available-shows-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 10px;
            }
        }

        @media (max-width: 480px) {
            .ranking-list {
                padding: 0 8px;
            }

            .leaderboard-item {
                padding: 12px 8px;
                gap: 8px;
            }

            .rank-number {
                font-size: 1rem;
                width: 32px;
            }

            .item-content h3 {
                font-size: 0.88rem;
            }

            .item-meta {
                font-size: 0.72rem;
            }

            .drag-handle {
                font-size: 0.9rem;
            }

            .remove-btn {
                padding: 6px 10px;
                font-size: 0.75rem;
            }
        }
    </style>

    <script>
        let watchlistData = [];
        let rankingIds = [];
        
        // Redirect to home if leaderboard is disabled
        if (localStorage.getItem('leaderboardEnabled') === 'false') {
            window.location.href = 'index.html';
        }

        function loadData() {
            const saved = localStorage.getItem('watchlistData');
            if (saved) {
                watchlistData = JSON.parse(saved);
                // Add IDs if missing
                watchlistData.forEach((item, index) => {
                    if (!item.id) item.id = 'item_' + Date.now() + '_' + index;
                });
                loadRankings();
                renderLeaderboard();
            } else {
                document.getElementById('rankingList').innerHTML = '<div class="no-items">No items in your watchlist yet. Add some movies and shows first!</div>';
            }
        }

        function loadRankings() {
            const savedRankings = localStorage.getItem('watchlistRankings');
            if (savedRankings) {
                const parsed = JSON.parse(savedRankings);
                // Handle multiple formats
                if (parsed.length > 0) {
                    if (typeof parsed[0] === 'string') {
                        // New format - array of IDs
                        rankingIds = parsed;
                    } else if (parsed[0].id && parsed[0].title) {
                        // Export format - array of {id, title}
                        rankingIds = parsed.map(r => r.id);
                    } else if (parsed[0].title) {
                        // Old format - array of full objects
                        rankingIds = parsed.map(rankItem => {
                            const found = watchlistData.find(w => w.title === rankItem.title);
                            return found ? found.id : null;
                        }).filter(id => id !== null);
                        saveRankings(); // Save in new format
                    }
                }
                // Filter out deleted items
                rankingIds = rankingIds.filter(id => 
                    watchlistData.find(w => w.id === id)
                );
            } else {
                rankingIds = [];
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function openAddToLeaderboardModal() {
            const modal = document.getElementById('addToLeaderboardModal');
            const grid = document.getElementById('availableShowsGrid');
            const noShowsMsg = document.getElementById('noShowsLeaderboard');
            const searchInput = document.getElementById('leaderboardSearchInput');
            
            // Get shows not in leaderboard
            const availableShows = watchlistData.filter(item => !rankingIds.includes(item.id));
            
            if (availableShows.length === 0) {
                grid.style.display = 'none';
                noShowsMsg.style.display = 'block';
            } else {
                grid.style.display = 'grid';
                noShowsMsg.style.display = 'none';
                renderAvailableShows(availableShows);
            }
            
            searchInput.value = '';
            modal.style.display = 'block';
        }

        function renderAvailableShows(shows) {
            const grid = document.getElementById('availableShowsGrid');
            
            grid.innerHTML = shows.map(item => {
                const letter = item.title.charAt(0).toUpperCase();
                
                if (item.poster) {
                    return `
                        <div class="leaderboard-show-card has-poster" onclick="addShowToLeaderboard('${item.id}')">
                            <img src="${item.poster}" alt="${escapeHtml(item.title)}" loading="lazy">
                            <div class="item-poster-footer">
                                <div class="item-poster-title">${escapeHtml(item.title)}</div>
                                <div class="item-poster-meta">
                                    ${item.year ? `<span>${escapeHtml(item.year)}</span>` : ''}
                                </div>
                            </div>
                        </div>`;
                } else {
                    return `
                        <div class="leaderboard-show-card no-poster" onclick="addShowToLeaderboard('${item.id}')">
                            <div class="item-poster-placeholder-letter">${escapeHtml(letter)}</div>
                            <div class="item-poster-title">${escapeHtml(item.title)}</div>
                        </div>`;
                }
            }).join('');
        }

        function addShowToLeaderboard(itemId) {
            if (!rankingIds.includes(itemId)) {
                rankingIds.push(itemId);
                saveRankings();
                renderLeaderboard();
                
                // Refresh the modal content
                const availableShows = watchlistData.filter(item => !rankingIds.includes(item.id));
                if (availableShows.length === 0) {
                    document.getElementById('availableShowsGrid').style.display = 'none';
                    document.getElementById('noShowsLeaderboard').style.display = 'block';
                } else {
                    const searchTerm = document.getElementById('leaderboardSearchInput').value.toLowerCase();
                    const filteredShows = searchTerm 
                        ? availableShows.filter(item => item.title.toLowerCase().includes(searchTerm))
                        : availableShows;
                    renderAvailableShows(filteredShows);
                }
            }
        }

        function filterAvailableShows() {
            const searchTerm = document.getElementById('leaderboardSearchInput').value.toLowerCase();
            const availableShows = watchlistData.filter(item => 
                !rankingIds.includes(item.id) &&
                item.title.toLowerCase().includes(searchTerm)
            );
            
            if (availableShows.length === 0) {
                document.getElementById('availableShowsGrid').innerHTML = '<p style="text-align: center; color: var(--silver); padding: 40px; grid-column: 1/-1;">No matching shows found.</p>';
            } else {
                renderAvailableShows(availableShows);
            }
        }

        function populateItemSelect() {
            // This function is no longer needed but kept for compatibility
        }

        function addToRanking() {
            // This function is no longer needed but kept for compatibility
        }

        let itemToRemove = null;

        function showRemoveConfirm(index) {
            itemToRemove = index;
            const itemId = rankingIds[index];
            const item = watchlistData.find(w => w.id === itemId);
            document.getElementById('removeMessage').textContent = `Remove "${item.title}" from leaderboard?`;
            document.getElementById('removeModal').style.display = 'block';
        }

        function confirmRemove() {
            if (itemToRemove !== null) {
                rankingIds.splice(itemToRemove, 1);
                saveRankings();
                populateItemSelect();
                renderLeaderboard();
                itemToRemove = null;
            }
            document.getElementById('removeModal').style.display = 'none';
        }

        function cancelRemove() {
            itemToRemove = null;
            document.getElementById('removeModal').style.display = 'none';
        }

        function saveRankings() {
            localStorage.setItem('watchlistRankings', JSON.stringify(rankingIds));
            localStorage.setItem('dataChanged', 'true');
            // Debounced backup — fires 3s after the last change
            const githubToken = localStorage.getItem('githubToken');
            if (githubToken) {
                clearTimeout(rankingBackupTimer);
                rankingBackupTimer = setTimeout(() => triggerGistBackup(githubToken), 3000);
            }
        }

        let rankingBackupTimer = null;

        function triggerGistBackup(githubToken) {
            const allData = JSON.parse(localStorage.getItem('watchlistData') || '[]');
            const rankingsWithNames = rankingIds.map(id => {
                const item = allData.find(w => w.id === id);
                return { id: id, title: item ? item.title : 'Unknown' };
            });
            const exportData = {
                watchlistData: allData,
                rankings: rankingsWithNames,
                timestamp: new Date().toISOString()
            };
            const gistId = localStorage.getItem('watchlyGistId');
            if (!gistId) return;
            fetch(`https://api.github.com/gists/${gistId}`, {
                method: 'PATCH',
                headers: {
                    'Authorization': `token ${githubToken}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ files: { 'watchly-backup.json': { content: JSON.stringify(exportData, null, 2) } } })
            }).then(response => {
                if (response.ok) {
                    localStorage.setItem('lastAutoBackup', Date.now());
                    localStorage.removeItem('dataChanged');
                }
            }).catch(err => console.error('Backup error:', err));
        }

        function renderLeaderboard() {
            const container = document.getElementById('rankingList');
            container.innerHTML = '';

            if (rankingIds.length === 0) {
                container.innerHTML = '<div class="no-items">No items to rank yet!</div>';
                return;
            }

            rankingIds.forEach((itemId, index) => {
                const item = watchlistData.find(w => w.id === itemId);
                if (!item) return;

                const div = document.createElement('div');
                div.className = 'ranking-item';
                div.dataset.index = index;

                div.innerHTML = `
                    <div class="rank-number">#${index + 1}</div>
                    <div class="item-info">
                        <div class="item-title">${item.title}</div>
                        <div class="item-details">${item.genres.join(', ')} ${item.year ? `(${item.year})` : ''}</div>
                    </div>
                    <button class="delete-from-ranking" onclick="showRemoveConfirm(${index})">×</button>
                    <div class="drag-handle" draggable="true">⋮⋮</div>
                `;

                // Drag events on the handle only, but operate on the parent item
                const handle = div.querySelector('.drag-handle');
                handle.addEventListener('dragstart', (e) => handleDragStart.call(div, e));
                handle.addEventListener('dragend', (e) => handleDragEnd.call(div, e));

                // Drop zone events stay on the item
                div.addEventListener('dragover', handleDragOver);
                div.addEventListener('dragleave', handleDragLeave);
                div.addEventListener('drop', handleDrop);

                // Touch events on the handle for mobile
                handle.addEventListener('touchstart', (e) => handleTouchStart.call(div, e), {passive: false});
                handle.addEventListener('touchmove', (e) => handleTouchMove.call(div, e), {passive: false});
                handle.addEventListener('touchend', (e) => handleTouchEnd.call(div, e));

                container.appendChild(div);
            });
        }

        let draggedElement = null;
        let touchStartY = 0;
        let touchElement = null;
        let touchOffset = 0;

        function handleDragStart(e) {
            draggedElement = this;
            this.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', this.dataset.index);
        }

        let autoScrollId = null;

        function autoScroll(direction) {
            if (autoScrollId) return;
            
            autoScrollId = requestAnimationFrame(function scroll() {
                window.scrollBy(0, direction * 8);
                autoScrollId = requestAnimationFrame(scroll);
            });
        }

        function stopAutoScroll() {
            if (autoScrollId) {
                cancelAnimationFrame(autoScrollId);
                autoScrollId = null;
            }
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            this.classList.add('drag-over');
            
            const threshold = 100;
            
            if (e.clientY < threshold) {
                autoScroll(-1);
            } else if (e.clientY > window.innerHeight - threshold) {
                autoScroll(1);
            } else {
                stopAutoScroll();
            }
        }

        function handleDragLeave(e) {
            if (!this.contains(e.relatedTarget)) {
                this.classList.remove('drag-over');
            }
        }

        function handleDrop(e) {
            e.preventDefault();
            if (this !== draggedElement) {
                const draggedIndex = parseInt(draggedElement.dataset.index);
                const targetIndex = parseInt(this.dataset.index);
                
                const draggedId = rankingIds.splice(draggedIndex, 1)[0];
                rankingIds.splice(targetIndex, 0, draggedId);
                
                saveRankings();
                renderLeaderboard();
            }
        }

        function handleDragEnd() {
            this.classList.remove('dragging');
            document.querySelectorAll('.ranking-item').forEach(item => {
                item.classList.remove('drag-over');
            });
            stopAutoScroll();
            draggedElement = null;
        }
        
        function handleTouchStart(e) {
            touchElement = this;
            touchStartY = e.touches[0].clientY;
            const rect = this.getBoundingClientRect();
            touchOffset = touchStartY - rect.top;
            this.classList.add('dragging');
        }
        
        function handleTouchMove(e) {
            e.preventDefault();
            if (!touchElement) return;
            
            const touch = e.touches[0];
            const currentY = touch.clientY;
            
            // Find element under touch
            const elementBelow = document.elementFromPoint(touch.clientX, currentY);
            const rankingItem = elementBelow?.closest('.ranking-item');
            
            // Clear previous highlights
            document.querySelectorAll('.ranking-item').forEach(item => {
                item.classList.remove('drag-over');
            });
            
            // Highlight current target
            if (rankingItem && rankingItem !== touchElement) {
                rankingItem.classList.add('drag-over');
            }
        }
        
        function handleTouchEnd(e) {
            if (!touchElement) return;
            
            const touch = e.changedTouches[0];
            const elementBelow = document.elementFromPoint(touch.clientX, touch.clientY);
            const targetItem = elementBelow?.closest('.ranking-item');
            
            if (targetItem && targetItem !== touchElement) {
                const draggedIndex = parseInt(touchElement.dataset.index);
                const targetIndex = parseInt(targetItem.dataset.index);
                
                const draggedId = rankingIds.splice(draggedIndex, 1)[0];
                rankingIds.splice(targetIndex, 0, draggedId);
                
                saveRankings();
                renderLeaderboard();
            }
            
            // Clean up
            touchElement.classList.remove('dragging');
            document.querySelectorAll('.ranking-item').forEach(item => {
                item.classList.remove('drag-over');
            });
            
            touchElement = null;
            touchStartY = 0;
            touchOffset = 0;
        }

        document.addEventListener('DOMContentLoaded', function() {
            loadData();
            document.getElementById('addToRankingBtn').addEventListener('click', openAddToLeaderboardModal);
            document.getElementById('confirmRemove').addEventListener('click', confirmRemove);
            document.getElementById('cancelRemove').addEventListener('click', cancelRemove);
            
            // Search functionality for modal
            document.getElementById('leaderboardSearchInput').addEventListener('input', filterAvailableShows);
            
            // Re-render instantly when another tab saves changes
            window.addEventListener('storage', function(e) {
                if (e.key === 'watchlistData') {
                    loadData();
                }
            });
            
            // Close modal when clicking X
            document.querySelectorAll('.close').forEach(closeBtn => {
                closeBtn.addEventListener('click', function() {
                    this.closest('.modal').style.display = 'none';
                });
            });
            
            // Close modal when clicking outside
            window.addEventListener('click', function(e) {
                if (e.target.classList.contains('modal')) {
                    e.target.style.display = 'none';
                }
            });
        });
    </script>
    <script src="footer.js"></script>
</body>
</html>
    
    <script>
        // Hamburger menu toggle
        document.addEventListener('DOMContentLoaded', function() {
            const hamburger = document.getElementById('hamburger');
            const navLinks = document.getElementById('navLinks');
            const siteBlur = document.getElementById('siteBlur');
            
            if (hamburger && navLinks) {
                hamburger.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const isOpen = hamburger.classList.contains('open');
                    
                    if (isOpen) {
                        closeMenu();
                    } else {
                        openMenu();
                    }
                });
                
                // Close menu when clicking blur overlay
                if (siteBlur) {
                    siteBlur.addEventListener('click', closeMenu);
                }
                
                // Close menu when clicking outside
                document.addEventListener('click', function(e) {
                    if (!hamburger.contains(e.target) && !navLinks.contains(e.target)) {
                        closeMenu();
                    }
                });
                
                // Close menu when clicking a nav link
                navLinks.querySelectorAll('.nav-link').forEach(link => {
                    link.addEventListener('click', function() {
                        closeMenu();
                    });
                });
                
                // Close menu on escape key
                document.addEventListener('keydown', function(e) {
                    if (e.key === 'Escape' && hamburger.classList.contains('open')) {
                        closeMenu();
                    }
                });
                
                // Menu control functions
                function openMenu() {
                    hamburger.classList.add('open');
                    navLinks.classList.add('open');
                    if (siteBlur) siteBlur.classList.add('active');
                    hamburger.setAttribute('aria-expanded', 'true');
                }
                
                function closeMenu() {
                    hamburger.classList.remove('open');
                    navLinks.classList.remove('open');
                    if (siteBlur) siteBlur.classList.remove('active');
                    hamburger.setAttribute('aria-expanded', 'false');
                }
            }
        });
    </script>
