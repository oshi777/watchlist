<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Watchly - Watch History</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=7">
</head>
<body>
    <!-- Fixed Navigation Bar -->
    <nav class="navbar">
        <div class="nav-brand" style="font-size: 0.75rem;">Watchly</div>
        <div class="nav-links">
            <a href="index.html" class="nav-link" style="font-size: 0.7rem;">Home</a>
            <a href="leaderboard.html" class="nav-link" style="font-size: 0.7rem;">Leaderboard</a>
            <a href="backup.html" class="nav-link" style="font-size: 0.7rem;">Backup</a>
            <a href="guide.html" class="nav-link" style="font-size: 0.7rem;">Guide</a>
            <a href="history.html" class="nav-link" style="font-size: 0.7rem;">History</a>
        </div>
    </nav>

    <div class="container">
        <header>
            <h1>Watch History</h1>
            <p>Everything you've watched, newest first</p>
        </header>

        <main>
            <div class="history-container" id="historyContainer"></div>
        </main>
    </div>

    <style>
        .history-container {
            max-width: 750px;
            margin: 0 auto;
        }

        /* Timeline spine */
        .timeline {
            position: relative;
            padding-left: 36px;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 10px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: linear-gradient(to bottom, var(--muted), transparent);
        }

        /* Year divider */
        .year-divider {
            position: relative;
            text-align: left;
            margin: 32px 0 18px -36px;
            padding-left: 36px;
        }

        .year-divider::before {
            content: '';
            position: absolute;
            left: 10px;
            top: 50%;
            width: 14px;
            height: 14px;
            background: var(--silver);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 12px rgba(195,199,206,0.5);
        }

        .year-label {
            display: inline-block;
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--light);
            letter-spacing: 2px;
            padding: 4px 0;
            border-bottom: 2px solid var(--muted);
        }

        /* Entry card */
        .history-entry {
            position: relative;
            background: var(--surface);
            border: 1px solid rgba(195,199,206,0.08);
            border-radius: 12px;
            padding: 16px 18px;
            margin-bottom: 12px;
            transition: all 0.25s ease;
        }

        .history-entry::before {
            content: '';
            position: absolute;
            left: -30px;
            top: 50%;
            width: 10px;
            height: 10px;
            background: var(--muted);
            border-radius: 50%;
            transform: translateY(-50%);
            transition: background 0.25s ease;
        }

        .history-entry:hover {
            border-color: rgba(195,199,206,0.2);
            transform: translateX(4px);
            box-shadow: 0 6px 24px rgba(0,0,0,0.35);
        }

        .history-entry:hover::before {
            background: var(--silver);
        }

        .entry-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
        }

        .entry-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--light);
            line-height: 1.3;
        }

        .entry-sub {
            font-size: 0.82rem;
            color: var(--silver);
            margin-top: 3px;
        }

        .entry-date {
            font-size: 0.8rem;
            color: var(--muted);
            white-space: nowrap;
            flex-shrink: 0;
            padding-top: 2px;
        }

        .entry-genres {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 10px;
        }

        .entry-genres .genre-tag {
            font-size: 0.72rem;
            padding: 3px 9px;
            cursor: default;
        }

        .entry-genres .genre-tag:hover {
            background: rgba(58,63,71,0.6);
            color: var(--light);
            transform: none;
            border-color: rgba(195,199,206,0.15);
        }

        .badge {
            display: inline-block;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-left: 8px;
            vertical-align: middle;
        }

        .badge-season {
            background: rgba(58,63,71,0.8);
            color: var(--silver);
            border: 1px solid rgba(195,199,206,0.15);
        }

        .badge-movie {
            background: rgba(58,63,71,0.8);
            color: var(--silver);
            border: 1px solid rgba(195,199,206,0.15);
        }

        .badge-show {
            background: rgba(195,199,206,0.15);
            color: var(--silver);
            border: 1px solid rgba(195,199,206,0.3);
        }

        .no-history {
            text-align: center;
            padding: 80px 20px;
            color: var(--silver);
            font-size: 1.2rem;
            background: var(--surface);
            border-radius: 15px;
            border: 1px solid rgba(195,199,206,0.1);
        }

        .history-count {
            text-align: center;
            color: var(--muted);
            font-size: 0.85rem;
            margin-bottom: 28px;
            letter-spacing: 0.5px;
        }

        @media (max-width: 480px) {
            .timeline {
                padding-left: 24px;
            }
            .timeline::before {
                left: 6px;
            }
            .year-divider {
                margin-left: -24px;
                padding-left: 24px;
            }
            .year-divider::before {
                left: 6px;
            }
            .history-entry::before {
                left: -20px;
                width: 8px;
                height: 8px;
            }
            .entry-title {
                font-size: 0.95rem;
            }
        }
    </style>

    <script>
        function parseDate(dateStr) {
            if (!dateStr) return null;
            const s = String(dateStr).trim();

            // Year only: "2023"
            if (/^\d{4}$/.test(s)) {
                return new Date(parseInt(s), 0, 1); // Jan 1 = earliest in that year
            }

            // "Jan 5, 2023" or "Jan 5 2023"
            const monthMap = {Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
            const parts = s.replace(',', '').split(' ');
            if (parts.length === 3 && monthMap[parts[0]] !== undefined) {
                return new Date(parseInt(parts[2]), monthMap[parts[0]], parseInt(parts[1]));
            }

            // ISO or anything else
            const d = new Date(s);
            return isNaN(d.getTime()) ? null : d;
        }

        function formatDisplayDate(dateStr) {
            if (!dateStr) return 'No date';
            const s = String(dateStr).trim();
            if (/^\d{4}$/.test(s)) return s;
            return s;
        }

        function buildEntries() {
            const saved = localStorage.getItem('watchlistData');
            if (!saved) return [];

            const watchlistData = JSON.parse(saved);
            const entries = [];

            watchlistData.forEach(item => {
                // Only include watched items or items with seasons logged
                const hasSeason = item.seasons && item.seasons.length > 0;
                const isWatched = item.status === 'watched';

                if (!isWatched && !hasSeason) return;

                // Add the top-level item entry only if it has no seasons/movies logged
                if (isWatched && item.date && !hasSeason) {
                    const raw = String(item.date).trim();
                    entries.push({
                        title: item.title,
                        subtitle: null,
                        type: item.isMovie ? 'movie' : 'show',
                        date: item.date,
                        parsedDate: parseDate(item.date),
                        yearOnly: /^\d{4}$/.test(raw),
                        typeRank: 0,  // top-level entries win ties
                        partNumber: 0,
                        genres: item.genres || [],
                        isMovie: item.isMovie
                    });
                }

                // Add each season/movie-part entry
                if (hasSeason) {
                    item.seasons.forEach(s => {
                        if (!s.date) return;
                        const raw = String(s.date).trim();
                        const label = item.isMovie
                            ? (s.season ? `Movie ${s.season}` : 'Movie')
                            : `Season ${s.season}`;
                        entries.push({
                            title: item.title,
                            subtitle: label,
                            type: item.isMovie ? 'movie-part' : 'season',
                            date: s.date,
                            parsedDate: parseDate(s.date),
                            yearOnly: /^\d{4}$/.test(raw),
                            typeRank: 1,  // seasons/parts lose to top-level on a tie
                            partNumber: s.season || 0,
                            genres: item.genres || [],
                            isMovie: item.isMovie
                        });
                    });
                }
            });

            return entries;
        }

        function render() {
            const container = document.getElementById('historyContainer');
            const entries = buildEntries();

            if (entries.length === 0) {
                container.innerHTML = '<div class="no-history">No watch history yet. Start marking things as watched!</div>';
                return;
            }

            // Sort: entries with dates newest→oldest, no-date entries at bottom
            const withDate = entries.filter(e => e.parsedDate !== null);
            const noDate   = entries.filter(e => e.parsedDate === null);

            // Sort: newest→oldest; ties broken by yearOnly, then typeRank (show/movie above seasons), then partNumber desc
            withDate.sort((a, b) => {
                const dateDiff = b.parsedDate - a.parsedDate;
                if (dateDiff !== 0) return dateDiff;
                // Same timestamp: full dates above year-only dates
                if (a.yearOnly !== b.yearOnly) return a.yearOnly ? 1 : -1;
                // Same date & same yearOnly: top-level show/movie above seasons (typeRank 0 < 1)
                if (a.typeRank !== b.typeRank) return a.typeRank - b.typeRank;
                // Both seasons/parts of same date: lower number goes lower on page
                return (b.partNumber || 0) - (a.partNumber || 0);
            });

            const sorted = [...withDate, ...noDate];

            // Count line
            const countEl = document.createElement('div');
            countEl.className = 'history-count';
            countEl.textContent = `${sorted.length} entr${sorted.length === 1 ? 'y' : 'ies'}`;
            container.appendChild(countEl);

            // Build timeline grouped by year
            const timeline = document.createElement('div');
            timeline.className = 'timeline';

            let currentYear = null;

            sorted.forEach(entry => {
                const year = entry.parsedDate
                    ? entry.parsedDate.getFullYear()
                    : null;

                const displayYear = year || 'No Date';

                if (displayYear !== currentYear) {
                    currentYear = displayYear;
                    const divider = document.createElement('div');
                    divider.className = 'year-divider';
                    divider.innerHTML = `<span class="year-label">${displayYear}</span>`;
                    timeline.appendChild(divider);
                }

                const card = document.createElement('div');
                card.className = 'history-entry';

                // Badge
                let badgeHtml = '';
                if (entry.type === 'season') {
                    badgeHtml = `<span class="badge badge-season">${entry.subtitle}</span>`;
                } else if (entry.type === 'movie-part') {
                    badgeHtml = `<span class="badge badge-movie">${entry.subtitle}</span>`;
                } else if (entry.type === 'show') {
                    badgeHtml = `<span class="badge badge-show">Show</span>`;
                } else {
                    badgeHtml = `<span class="badge badge-movie">Movie</span>`;
                }

                const genresHtml = entry.genres.length
                    ? `<div class="entry-genres">${entry.genres.map(g => `<span class="genre-tag">${g}</span>`).join('')}</div>`
                    : '';

                card.innerHTML = `
                    <div class="entry-top">
                        <div>
                            <div class="entry-title">${entry.title}${badgeHtml}</div>
                        </div>
                        <div class="entry-date">${formatDisplayDate(entry.date)}</div>
                    </div>
                    ${genresHtml}
                `;

                timeline.appendChild(card);
            });

            container.appendChild(timeline);
        }

        document.addEventListener('DOMContentLoaded', render);
    </script>
</body>
</html>
